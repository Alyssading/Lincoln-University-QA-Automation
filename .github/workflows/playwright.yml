name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest # 使用 Linux 云服务器
    steps:
    - uses: actions/checkout@v4 # 第一步：把你的代码下载到云服务器上

    - uses: actions/setup-node@v4 # 第二步：安装 Node.js 环境
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm install # 第三步：安装项目需要的插件

    - name: Install Playwright Browsers
      # 这是最关键的一步！安装浏览器及其系统依赖，修复你之前的报错
      run: npx playwright install --with-deps 

    - name: Run Playwright tests
      run: npx playwright test # 第四步：真正开始跑你的自动化脚本

    - uses: actions/upload-artifact@v4 # 第五步：不管成功还是失败，把测试报告保存下来
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
